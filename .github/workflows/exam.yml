name: exam
on:
  push:
    branches:
      - 'feature/**'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
  notify:
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Build failed'